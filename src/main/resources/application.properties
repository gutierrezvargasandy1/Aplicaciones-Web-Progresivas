# =====================================================================
# Los valores sensibles (credenciales y tokens) se leen de variables de
# entorno o del servidor de configuración. NUNCA escribirlos aquí.
# =====================================================================
spring.application.name=prueba
spring.config.import=optional:configserver:

# ---------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prueba}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------
# GestoPago - Autenticación (existente)
# El token dura 24 h y la documentación pide pedir solo uno al día.
# ---------------------------------------------------------------------
gestopago.auth.url=${GESTOPAGO_AUTH_URL:https://gestopago.portalventas.net}
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:0}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:}
gestopago.auth.password=${GESTOPAGO_PASSWORD:}
gestopago.auth.refresh-rate-ms=86400000

# ---------------------------------------------------------------------
# GestoPago - Catálogo de productos (nuevo)
# ---------------------------------------------------------------------
gestopago.product.url=${GESTOPAGO_PRODUCT_URL:https://gestopago.portalventas.net}
gestopago.product.token=${GESTOPAGO_PRODUCT_TOKEN:}
gestopago.product.api-key=${GESTOPAGO_API_KEY:}
gestopago.product.connect-timeout-ms=5000
gestopago.product.read-timeout-ms=30000
gestopago.product.cache-refresh-cron=0 0 3 * * *

# Configuración Feign del cliente "gestoPagoProduct"
# basic = método, URL, status y duración. Nunca registra headers (el token no se expone).
spring.cloud.openfeign.client.config.gestoPagoProduct.connect-timeout=${gestopago.product.connect-timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProduct.read-timeout=${gestopago.product.read-timeout-ms}
spring.cloud.openfeign.client.config.gestoPagoProduct.logger-level=basic
logging.level.com.proyecto.servicios.client.GestoPagoProductClient=DEBUG